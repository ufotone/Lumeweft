<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d20"/>
      <stop offset="0.55" stop-color="#070b18"/>
      <stop offset="1" stop-color="#02050c"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2ffff"/>
      <stop offset="0.55" stop-color="#e3f2ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="halo" cx="48%" cy="54%" r="45%">
      <stop offset="0" stop-color="#315bad" stop-opacity="0.66"/>
      <stop offset="0.55" stop-color="#162d67" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#071022" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="1020" height="1020" rx="208" fill="url(#background)"/>
  <rect x="34" y="34" width="956" height="956" rx="190" fill="none" stroke="#1c263a" stroke-width="5"/>
  <circle cx="500" cy="548" r="390" fill="url(#halo)"/>

  <path d="M326 238 H456 V654 H716 V782 H326 Z"
        fill="#7ab7ff" opacity="0.52" filter="url(#glow)"/>
  <path d="M326 238 H456 V654 H716 V782 H326 Z"
        fill="url(#letter)" stroke="#d8edff" stroke-width="3" stroke-linejoin="round"/>
</svg>
