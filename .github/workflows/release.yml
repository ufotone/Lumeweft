name: Release Windows Alpha

on:
  push:
    tags:
      - "v*-alpha.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Alpha release tag to build or rebuild
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  ensure-release:
    name: Prepare Alpha Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Reusing existing release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "Lumeweft $RELEASE_TAG (Alpha)" \
              --notes-file docs/RELEASE_NOTES_0.3.28_ALPHA_3.md
          fi

  build-windows:
    name: Build Windows Installer
    needs: ensure-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: app_version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows installer
        run: npm run build && npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.app_version.outputs.app_version }}"
          gh release upload $env:RELEASE_TAG `
            "release/Lumeweft-$version-windows-installer-x64.exe#Windows x64 Installer" `
            --clobber

      - name: Publish alpha prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit $env:RELEASE_TAG `
            --draft=false `
            --prerelease `
            --title "Lumeweft $env:RELEASE_TAG (Alpha)" `
            --notes-file docs/RELEASE_NOTES_0.3.28_ALPHA_3.md
